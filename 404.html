<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#e5007d" />
    <title>Page not found · UniCycleHK</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <style>
      :root { color: #191919; background: #f5f5f3; font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; background: linear-gradient(135deg, #f5f5f3 0 62%, #fff0f7 62% 100%); }
      main { width: min(720px, 100%); overflow: hidden; border-top: 7px solid #e5007d; background: #fff; box-shadow: 0 28px 80px rgba(52,17,35,.18); }
      .content { padding: clamp(32px, 7vw, 72px); }
      .code { margin: 0; color: #a8005b; font-size: 14px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
      h1 { max-width: 580px; margin: 16px 0; font-size: clamp(42px, 8vw, 78px); line-height: .96; letter-spacing: -.055em; }
      p { max-width: 510px; margin: 0 0 28px; color: #5e5e5e; font-size: 17px; line-height: 1.6; }
      a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0 22px; color: #fff; background: #e5007d; text-decoration: none; font-weight: 800; }
      a:hover { background: #191919; }
      a:focus-visible { outline: 3px solid #f28a2e; outline-offset: 4px; }
      footer { display: flex; align-items: center; gap: 10px; padding: 18px clamp(32px, 7vw, 72px); color: #fff; background: #191919; font-size: 13px; }
      .mark { width: 28px; height: 28px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #f28a2e 0 38%, #e5007d 39%); font-weight: 900; }
    </style>
  </head>
  <body>
    <main>
      <div class="content">
        <p class="code">Error 404</p>
        <h1>This listing has moved on.</h1>
        <p>The page you followed does not exist. Return to the marketplace to browse available student listings.</p>
        <a href="./#home">Back to UniCycleHK</a>
      </div>
      <footer><span class="mark">U</span><strong>UniCycleHK</strong></footer>
    </main>
    <script>
      if ("caches" in window) {
        caches.keys().then((keys) => Promise.all(
          keys.filter((key) => key.startsWith("unicyclehk-shell-") && key !== "unicyclehk-shell-v5")
            .map((key) => caches.delete(key))
        ));
      }
    </script>
  </body>
</html>
